<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | ShopEasy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="container pad">
<h1 class="page-title">Our Products</h1><p class="lead">Loaded from <code>data/products.xml</code></p>
<div class="toolbar"><input id="q" type="search" placeholder="Search products...">
<select id="cat"><option value="">All categories</option></select>
<select id="sort"><option value="">Sort by</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="rating">Top rated</option></select>
<span id="count"></span></div><div class="grid" id="grid"></div></main>
<footer id="site-footer"></footer>
<script src="js/app.js"></script>
<script>
renderLayout('products.html');
let all=[];
function draw(){const q=$('#q').value.toLowerCase(),c=$('#cat').value,s=$('#sort').value;
  const l=all.filter(p=>(!c||p.category===c)&&p.name.toLowerCase().includes(q));
  if(s==='low')l.sort((a,b)=>a.price-b.price);if(s==='high')l.sort((a,b)=>b.price-a.price);if(s==='rating')l.sort((a,b)=>b.rating-a.rating);
  $('#grid').innerHTML=l.length?l.map(card).join(''):'<p class="empty">No products found.</p>';$('#count').textContent=l.length+' products';}
loadProducts().then(ps=>{all=ps;[...new Set(ps.map(p=>p.category))].forEach(c=>$('#cat').insertAdjacentHTML('beforeend','<option>'+c+'</option>'));draw();}).catch(fail('#grid'));
['q','cat','sort'].forEach(id=>$('#'+id).addEventListener('input',draw));
</script>
</body>
</html>
