<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Details | ShopEasy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="container pad"><div id="detail"></div></main>
<footer id="site-footer"></footer>
<script src="js/app.js"></script>
<script>
renderLayout('products.html');
const id=+new URLSearchParams(location.search).get('id');
loadProducts().then(ps=>{const p=ps.find(x=>x.id===id);
  if(!p){$('#detail').innerHTML='<p class="empty">Product not found. <a href="products.html">Back to products</a></p>';return;}
  document.title=p.name+' | ShopEasy';
  $('#detail').innerHTML=`<div class="detail"><div class="thumb big">${p.icon}</div><div><small>${esc(p.category)}</small><h1>${esc(p.name)}</h1>
  <div class="stars">${stars(p.rating)} <span>${p.rating} / 5</span></div><p class="price">${money(p.price)}</p><p>${esc(p.description)}</p>
  <div class="qty-row"><input type="number" id="qty" value="1" min="1" max="10"><button class="btn" id="add">Add to cart</button><a class="btn outline" href="cart.html">View cart</a></div>
  <ul class="meta"><li>✔ In stock</li><li>✔ Free shipping over $100</li><li>✔ 30-day returns</li></ul></div></div>
  <h2 class="sec">Related products</h2><div class="grid">${ps.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4).map(card).join('')}</div>`;
  $('#add').onclick=()=>addToCart(p.id,Math.max(1,Math.min(10,+$('#qty').value||1)));
}).catch(fail('#detail'));
</script>
</body>
</html>
